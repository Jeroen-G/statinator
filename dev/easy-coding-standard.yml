services:
  PhpCsFixer\Fixer\Strict\DeclareStrictTypesFixer: null
  PhpCsFixer\Fixer\Strict\StrictComparisonFixer: null
  PhpCsFixer\Fixer\Strict\StrictParamFixer: null
  PhpCsFixer\Fixer\FunctionNotation\ReturnTypeDeclarationFixer: null
  SlevomatCodingStandard\Sniffs\ControlStructures\AssignmentInConditionSniff: null
  PhpCsFixer\Fixer\Alias\MbStrFunctionsFixer: null
  PhpCsFixer\Fixer\ClassNotation\OrderedClassElementsFixer: null
  PhpCsFixer\Fixer\ClassNotation\PropertyTypeDeclarationFixer: null
  PhpCsFixer\Fixer\FunctionNotation\NativeTypeDeclarationFixer: null
  PhpCsFixer\Fixer\ClassNotation\PromotedConstructorPropertyFixer: null

parameters:
  sets:
    - 'clean-code'
    - 'psr12'

  exclude_files:
    - 'node_modules/*'
    - 'vendor/*'
    - 'bootstrap/*'
